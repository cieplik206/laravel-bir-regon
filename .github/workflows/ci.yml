name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Audit dependencies
        run: composer audit

  runtime_minimum:
    name: Runtime minimum (Laravel components 13.0, PHP 8.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Remove development-only constraints
        run: >
          composer remove --dev
          larastan/larastan
          laravel/pint
          orchestra/testbench
          pestphp/pest
          pestphp/pest-plugin-laravel
          pestphp/pest-plugin-phpstan
          --no-update --no-interaction

      - name: Resolve the minimum runtime platform
        run: |
          composer config platform.php 8.4.0
          composer update \
            --prefer-lowest --prefer-stable \
            --with "illuminate/cache:13.0.0" \
            --with "illuminate/contracts:13.0.0" \
            --with "illuminate/support:13.0.0" \
            --prefer-dist --no-interaction --no-progress

      - name: Verify runtime platform requirements
        run: composer check-platform-reqs --no-dev

  tests:
    name: Tests (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '13'
            testbench: '^11.0'
            php: '8.4'
            dependencies: lowest
            composer-options: --prefer-lowest --prefer-stable
          - laravel: '13'
            testbench: '^11.0'
            php: '8.4'
            dependencies: highest
            composer-options: ''
          - laravel: '13'
            testbench: '^11.0'
            php: '8.5'
            dependencies: highest
            composer-options: ''

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Laravel ${{ matrix.laravel }} with ${{ matrix.dependencies }} dependencies
        run: >
          composer update
          --with "orchestra/testbench:${{ matrix.testbench }}"
          ${{ matrix.composer-options }}
          --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  passed:
    name: CI Passed
    if: always()
    needs:
      - quality
      - runtime_minimum
      - tests
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: Verify all CI jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUNTIME_MINIMUM_RESULT: ${{ needs.runtime_minimum.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUNTIME_MINIMUM_RESULT" = success
          test "$TESTS_RESULT" = success
